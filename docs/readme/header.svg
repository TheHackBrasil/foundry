<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">The Foundry</title>
  <desc id="d">Marca da The Foundry, um F com uma bigorna em laranja, ao lado do nome do time e da frase: camada de coordenação para logística B2B.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ece9e3" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="heat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(182 238) scale(190 150)">
      <stop offset="0" stop-color="#EA5808" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#7a3410" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a0c0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="billet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a8"/>
      <stop offset=".35" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#EA5808"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA5808" stop-opacity=".9"/>
      <stop offset="1" stop-color="#EA5808" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .glow{animation:breathe 3.6s ease-in-out infinite;transform-origin:182px 238px}
      .hot{animation:heat 3.6s ease-in-out infinite}
      .spark{animation:fly 2.4s cubic-bezier(.2,.6,.4,1) infinite}
      .s2{animation-delay:.5s}.s3{animation-delay:1.1s}.s4{animation-delay:1.6s}.s5{animation-delay:.8s}.s6{animation-delay:1.9s}
      .route{stroke-dasharray:10 190;animation:run 7s linear infinite}
      .pip{animation:blink 1.8s steps(2,end) infinite}
      @keyframes breathe{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
      @keyframes heat{0%,100%{opacity:.15}50%{opacity:.75}}
      @keyframes fly{0%{transform:translate(-22px,46px);opacity:0}15%{opacity:1}100%{transform:none;opacity:0}}
      @keyframes run{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
      @keyframes blink{0%{opacity:1}100%{opacity:.25}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0a0c0e"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <ellipse class="glow" cx="182" cy="238" rx="190" ry="150" fill="url(#heat)"/>

    <!-- linhas de rota ao fundo -->
    <path d="M330 344 C520 300 640 352 820 316 S1080 280 1200 300" fill="none" stroke="#7a3410" stroke-width="1.2" stroke-opacity=".55"/>
    <path class="route" pathLength="200" d="M330 344 C520 300 640 352 820 316 S1080 280 1200 300" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-linecap="round"/>
    <path d="M760 0 C800 60 900 70 1000 52 S1150 30 1200 70" fill="none" stroke="#7a3410" stroke-width="1" stroke-opacity=".4"/>
    <circle cx="820" cy="316" r="3" fill="#EA5808"/>
    <circle cx="1000" cy="52" r="2.5" fill="#7a3410"/>
  </g>

  <!-- marca oficial: F + bigorna -->
  <g transform="translate(78 62) scale(.5) translate(-64 -42)">
    <path fill="#EA5808" d="M144 58H432.9L369.6 121.3H161.5Q140.6 121.3 140.6 142.2V206.8H383.1L314.4 272.8H178.3Q123.1 272.8 123.1 326L122.4 433.8Q112 448 80 454V122Z"/>
    <path fill="#EA5808" d="M144 323.3H348.7V344.9C312 358 278.7 376 278.7 400C278.7 418 294 429 319.1 436.5V454H172.9V436.5C198 429 211.3 418 211.3 400C211.3 376 178 358 144 344.9Z"/>
    <path class="hot" fill="url(#billet)" d="M144 323.3H348.7V344.9C312 358 278.7 376 278.7 400C278.7 418 294 429 319.1 436.5V454H172.9V436.5C198 429 211.3 418 211.3 400C211.3 376 178 358 144 344.9Z"/>
  </g>

  <!-- faíscas saindo da bigorna -->
  <g fill="#ff8a3d">
    <circle class="spark" cx="214" cy="186" r="2.4"/>
    <circle class="spark s2" cx="238" cy="170" r="1.8"/>
    <circle class="spark s3" cx="196" cy="160" r="1.6" fill="#ffd2a8"/>
    <circle class="spark s4" cx="256" cy="194" r="2"/>
    <circle class="spark s5" cx="270" cy="160" r="1.4" fill="#ffd2a8"/>
    <circle class="spark s6" cx="230" cy="140" r="1.6"/>
  </g>

  <!-- status -->
  <g transform="translate(886 34)">
    <rect width="280" height="30" rx="15" fill="#0a0c0e" stroke="#7a3410"/>
    <circle class="pip" cx="20" cy="15" r="4" fill="#EA5808"/>
    <text x="34" y="20" fill="#ece9e3" fill-opacity=".85" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5">HIPÓTESE EM CONSTRUÇÃO</text>
  </g>

  <!-- wordmark -->
  <text x="340" y="116" fill="#EA5808" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="15" letter-spacing="3">HACKBRASIL 2026 · LOGÍSTICA &amp; AUTOMAÇÃO</text>
  <text x="336" y="194" fill="#ece9e3" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="84" font-weight="700" letter-spacing="1">THE FOUNDRY</text>
  <line x1="340" y1="220" x2="1160" y2="220" stroke="url(#fade)" stroke-width="1" stroke-opacity=".5"/>
  <line x1="340" y1="220" x2="440" y2="220" stroke="#EA5808" stroke-width="4" stroke-linecap="round"/>
  <text x="340" y="262" fill="#ece9e3" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="600">Camada de coordenação para logística B2B.</text>
  <text x="340" y="296" fill="#ece9e3" fill-opacity=".62" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Conecta os sistemas que os parceiros já usam e avisa todos quando um pedido muda.</text>
</svg>
